name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: gd, pdo_sqlite, sqlite3, curl, mbstring, zip, fileinfo, intl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          touch database/database.sqlite

      - name: npm ci
        run: npm ci

      # Generates the wayfinder routes / actions (vite plugin) that tsc needs and the vite manifest
      # the feature tests render pages with.
      - name: Build
        run: npm run build

      - name: TypeScript
        run: npx tsc --noEmit -p .

      - name: Lint and format (vp check)
        run: npx vp check

      - name: JS tests
        run: npm test

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHP tests
        run: php artisan test
